<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion véhicule</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#111827}
.card{width:100%;max-width:430px;background:white;border-radius:28px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.car{font-size:58px;text-align:center;margin-bottom:10px}
h1{text-align:center;margin:0;font-size:29px}
.subtitle{text-align:center;color:#6b7280;margin:8px 0 22px}
.status{text-align:center;padding:12px;border-radius:14px;font-weight:700;margin-bottom:24px;background:#dcfce7;color:#166534}
.status.borrowed{background:#fee2e2;color:#991b1b}
label{display:block;font-weight:600;margin-top:15px}
input{width:100%;padding:15px;margin-top:7px;border:1px solid #d1d5db;border-radius:13px;font-size:17px}
button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:22px;font-size:17px;font-weight:700;cursor:pointer;background:#111827;color:white}
button:disabled{opacity:.6}
.return{background:#e5e7eb;color:#111827}
.message{margin-top:18px;padding:13px;border-radius:12px;text-align:center;display:none}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
</style>
</head>

<body>
<div class="card">
<div class="car">🚗</div>
<h1 id="vehicleName">Gestion véhicule</h1>
<div class="subtitle">Gestion des emprunts</div>

<div id="status" class="status">Chargement...</div>
<div id="content"></div>
<div id="message" class="message"></div>
</div>

<script>
const SUPABASE_URL="https://jnuzpdljawgoznxmyehm.supabase.co";
const SUPABASE_KEY="sb_publishable_nQTVujJC9UE1iY2RREITgQ_G70n7nIv";
const ACTION_URL=SUPABASE_URL+"/functions/v1/vehicle-email-action";

const token=new URLSearchParams(window.location.search).get("token");

const statusBox=document.getElementById("status");
const content=document.getElementById("content");
const message=document.getElementById("message");

async function getVehicle(){
  if(!token) throw new Error("QR code invalide.");

  const response=await fetch(
    SUPABASE_URL+"/rest/v1/vehicles?select=id,name,status&qr_token=eq."+encodeURIComponent(token),
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      }
    }
  );

  if(!response.ok) throw new Error("Impossible de charger le véhicule.");

  const vehicles=await response.json();

  if(!vehicles.length) throw new Error("Véhicule introuvable.");

  return vehicles[0];
}

async function loadVehicle(){
  try{
    const vehicle=await getVehicle();

    document.getElementById("vehicleName").textContent=vehicle.name;

    if(vehicle.status==="available"){
      statusBox.textContent="🟢 Véhicule disponible";
      statusBox.className="status";

      content.innerHTML=`
        <form id="borrowForm">
          <label>Prénom
            <input id="firstName" required autocomplete="given-name" placeholder="Votre prénom">
          </label>

          <label>Nom
            <input id="lastName" required autocomplete="family-name" placeholder="Votre nom">
          </label>

          <button type="submit">Prendre le véhicule</button>
        </form>
      `;

      document.getElementById("borrowForm").addEventListener("submit",borrowVehicle);

    }else{
      statusBox.textContent="🔴 Véhicule actuellement emprunté";
      statusBox.className="status borrowed";

      content.innerHTML=`
        <button class="return" id="returnButton">
          Retourner le véhicule
        </button>
      `;

      document.getElementById("returnButton").addEventListener("click",returnVehicle);
    }

  }catch(error){
    statusBox.textContent="❌ Erreur";
    statusBox.className="status borrowed";
    showMessage(error.message,true);
  }
}

async function vehicleAction(action,firstName="",lastName=""){
  const response=await fetch(ACTION_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      action,
      token,
      first_name:firstName,
      last_name:lastName
    })
  });

  let data;

  try{
    data=await response.json();
  }catch{
    throw new Error("Réponse invalide du serveur.");
  }

  if(!response.ok || !data.ok){
    throw new Error(data.error || "L'opération a échoué.");
  }

  return data;
}

async function borrowVehicle(event){
  event.preventDefault();

  const button=event.target.querySelector("button");
  const firstName=document.getElementById("firstName").value.trim();
  const lastName=document.getElementById("lastName").value.trim();

  if(!firstName || !lastName){
    showMessage("Prénom et nom obligatoires.",true);
    return;
  }

  button.disabled=true;
  button.textContent="Enregistrement...";

  try{
    await vehicleAction("borrow",firstName,lastName);

    showMessage(
      "✅ Véhicule pris avec succès. Notification envoyée.",
      false
    );

    setTimeout(loadVehicle,1200);

  }catch(error){
    showMessage(error.message,true);
    button.disabled=false;
    button.textContent="Prendre le véhicule";
  }
}

async function returnVehicle(){
  const button=document.getElementById("returnButton");

  if(button){
    button.disabled=true;
    button.textContent="Enregistrement...";
  }

  try{
    await vehicleAction("return");

    showMessage(
      "✅ Véhicule retourné avec succès. Notification envoyée.",
      false
    );

    setTimeout(loadVehicle,1200);

  }catch(error){
    showMessage(error.message,true);

    if(button){
      button.disabled=false;
      button.textContent="Retourner le véhicule";
    }
  }
}

function showMessage(text,error){
  message.textContent=text;
  message.className="message "+(error?"error":"success");
  message.style.display="block";
}

loadVehicle();
</script>
</body>
</html>
