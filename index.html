<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renault ZOE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#111827}
.card{width:100%;max-width:430px;background:white;border-radius:28px;padding:30px 24px;box-shadow:0 20px 50px #0002}
.car{text-align:center;font-size:58px}
h1{text-align:center;margin:8px 0;font-size:29px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:24px}
.status{padding:14px;border-radius:14px;text-align:center;font-weight:700;margin-bottom:24px;background:#dcfce7;color:#166534}
.borrowed{background:#fee2e2;color:#991b1b}
label{display:block;font-weight:600;margin-top:15px}
input{width:100%;padding:15px;margin-top:7px;border:1px solid #d1d5db;border-radius:13px;font-size:17px}
button{width:100%;padding:16px;border:0;border-radius:14px;margin-top:22px;font-size:17px;font-weight:700;background:#111827;color:white}
button:disabled{opacity:.6}
.return{background:#e5e7eb;color:#111827}
.message{display:none;margin-top:18px;padding:14px;border-radius:13px;text-align:center;font-weight:600}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
</style>
</head>

<body>
<main class="card">
<div class="car">🚗</div>
<h1 id="vehicleName">Renault ZOE</h1>
<div class="subtitle">Gestion des emprunts</div>
<div id="status" class="status">Chargement...</div>
<div id="content"></div>
<div id="message" class="message"></div>
</main>

<script>
const SUPABASE_URL="https://jnuzpdljawgoznxmyehm.supabase.co";
const SUPABASE_KEY="sb_publishable_nQTVujJC9UE1iY2RREITgQ_G70n7nIv";
const token=new URLSearchParams(location.search).get("token");

const statusBox=document.getElementById("status");
const content=document.getElementById("content");
const message=document.getElementById("message");

async function request(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
   ...options,
   headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+SUPABASE_KEY,
     "Content-Type":"application/json",
     ...(options.headers||{})
   }
 });
 const text=await r.text();
 let data;
 try{data=JSON.parse(text)}catch{data=text}
 if(!r.ok)throw new Error(data?.message||data?.error||"Une erreur est survenue.");
 return data;
}

function msg(text,error=false){
 message.textContent=text;
 message.className="message "+(error?"error":"success");
}

async function load(){
 if(!token){
   statusBox.textContent="QR code invalide";
   statusBox.className="status borrowed";
   return;
 }

 try{
   const vehicles=await request(
     "/rest/v1/vehicles?select=id,name,status&qr_token=eq."+encodeURIComponent(token)
   );

   if(!vehicles.length)throw new Error("Véhicule introuvable.");

   const v=vehicles[0];
   document.getElementById("vehicleName").textContent=v.name;

   if(v.status==="available"){
     statusBox.textContent="🟢 Véhicule disponible";
     statusBox.className="status";

     content.innerHTML=`
       <form id="borrowForm">
         <label>Prénom
           <input id="firstName" required placeholder="Votre prénom">
         </label>
         <label>Nom
           <input id="lastName" required placeholder="Votre nom">
         </label>
         <button id="borrowButton">Prendre le véhicule</button>
       </form>`;

     document.getElementById("borrowForm")
       .addEventListener("submit",borrow);
   }else{
     statusBox.textContent="🔴 Véhicule actuellement emprunté";
     statusBox.className="status borrowed";

     content.innerHTML=`
       <button id="returnButton" class="return">
         Retourner le véhicule
       </button>`;

     document.getElementById("returnButton")
       .addEventListener("click",retour);
   }
 }catch(e){
   statusBox.textContent="Erreur";
   statusBox.className="status borrowed";
   msg(e.message,true);
 }
}

async function action(type,firstName="",lastName=""){
 return await request("/functions/v1/vehicle-email-action",{
   method:"POST",
   body:JSON.stringify({
     action:type,
     token:token,
     first_name:firstName,
     last_name:lastName
   })
 });
}

async function borrow(e){
 e.preventDefault();

 const button=document.getElementById("borrowButton");
 const first=document.getElementById("firstName").value.trim();
 const last=document.getElementById("lastName").value.trim();

 button.disabled=true;
 button.textContent="Enregistrement...";

 try{
   const result=await action("borrow",first,last);
   if(!result.ok)throw new Error(result.error||"Erreur");

   msg("✅ Véhicule pris avec succès.");
   setTimeout(load,1200);
 }catch(e){
   msg(e.message,true);
   button.disabled=false;
   button.textContent="Prendre le véhicule";
 }
}

async function retour(){
 const button=document.getElementById("returnButton");

 button.disabled=true;
 button.textContent="Enregistrement...";

 try{
   const result=await action("return");
   if(!result.ok)throw new Error(result.error||"Erreur");

   msg("✅ Véhicule retourné avec succès.");
   setTimeout(load,1200);
 }catch(e){
   msg(e.message,true);
   button.disabled=false;
   button.textContent="Retourner le véhicule";
 }
}

load();
</script>
</body>
</html>
