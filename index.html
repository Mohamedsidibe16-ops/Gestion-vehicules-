<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion véhicule</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:white;border-radius:24px;padding:30px 24px;box-shadow:0 15px 40px #0002}
.car{text-align:center;font-size:55px}
h1{text-align:center;margin:10px 0}
.sub{text-align:center;color:#666;margin-bottom:24px}
.status{text-align:center;padding:14px;border-radius:14px;background:#dcfce7;color:#166534;font-weight:bold;margin-bottom:22px}
.red{background:#fee2e2;color:#991b1b}
label{display:block;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:15px;border:1px solid #ccc;border-radius:12px;font-size:17px}
button{width:100%;padding:16px;margin-top:18px;border:0;border-radius:12px;background:#111827;color:white;font-size:17px;font-weight:bold}
.msg{display:none;margin-top:18px;padding:13px;border-radius:12px;text-align:center}
.error{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
.center{text-align:center;color:#666;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<div class="car">🚗</div>
<h1 id="vehicle">Gestion véhicule</h1>
<div class="sub">Gestion des emprunts</div>
<div id="status" class="status">Chargement...</div>
<div id="content"></div>
<div id="msg" class="msg"></div>
</div>

<script>
const S="https://jnuzpdljawgoznxmyehm.supabase.co";
const K="sb_publishable_nQTVujJC9UE1iY2RREITgQ_G70n7nIv";
const A=S+"/functions/v1/vehicle-email-action";
const q=new URLSearchParams(location.search);
const token=q.get("token");
const rt=q.get("return");
const st=document.getElementById("status");
const ct=document.getElementById("content");
const mg=document.getElementById("msg");

function message(t,e=false){
mg.textContent=t;
mg.className="msg "+(e?"error":"ok");
mg.style.display="block";
}

async function post(data){
const r=await fetch(A,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
const j=await r.json();
if(!r.ok||!j.ok)throw Error(j.error||"Opération impossible.");
return j;
}

async function load(){
if(!token)throw Error("QR code invalide.");

const r=await fetch(
S+"/rest/v1/vehicles?select=name,status&qr_token=eq."+encodeURIComponent(token),
{
headers:{
apikey:K,
Authorization:"Bearer "+K
}
});

if(!r.ok)throw Error("Impossible de charger le véhicule.");

const v=await r.json();

if(!v.length)throw Error("Véhicule introuvable.");

document.getElementById("vehicle").textContent=v[0].name;

if(v[0].status==="available"){

st.textContent="🟢 Véhicule disponible";

ct.innerHTML=`
<label>Votre adresse e-mail</label>
<input id="email" type="email" required placeholder="prenom.nom@enedis.fr">
<button id="borrow">Prendre le véhicule</button>
`;

document.getElementById("borrow").onclick=borrow;

}else{

st.textContent="🔴 Véhicule actuellement emprunté";
st.className="status red";

ct.innerHTML=`
<div class="center">
<p>Ce véhicule est actuellement emprunté.</p>
<p>Le retour se fait avec le lien personnel reçu par e-mail.</p>
</div>`;

}
}

async function borrow(){

const email=document.getElementById("email").value.trim().toLowerCase();
const b=document.getElementById("borrow");

if(!email){
message("Adresse e-mail obligatoire.",true);
return;
}

b.disabled=true;
b.textContent="Enregistrement...";

try{

await post({
action:"borrow",
token:token,
email:email
});

st.textContent="🔴 Véhicule emprunté";
st.className="status red";

ct.innerHTML=`
<div class="center">
<h2>✅ Emprunt enregistré</h2>
<p>Un e-mail contenant votre lien personnel de retour vient de vous être envoyé.</p>
<strong>Prudence sur la route 🚗</strong>
</div>`;

message("Emprunt enregistré avec succès.");

}catch(e){

message(e.message,true);
b.disabled=false;
b.textContent="Prendre le véhicule";

}
}

function returnPage(){

st.textContent="🔐 Retour du véhicule";

ct.innerHTML=`
<div class="center">
<p>Ce lien est personnel à votre emprunt.</p>
<button id="back">Retourner le véhicule</button>
</div>`;

document.getElementById("back").onclick=back;
}

async function back(){

const b=document.getElementById("back");

b.disabled=true;
b.textContent="Enregistrement...";

try{

await post({
action:"return",
return_token:rt
});

st.textContent="🟢 Véhicule disponible";

ct.innerHTML=`
<div class="center">
<h2>✅ Retour enregistré</h2>
<p>Le véhicule est maintenant disponible.</p>
<strong>Prudence sur la route 🚗</strong>
</div>`;

message("Retour enregistré avec succès.");

}catch(e){

message(e.message,true);
b.disabled=false;
b.textContent="Retourner le véhicule";

}
}

if(rt){
returnPage();
}else{
load().catch(e=>{
st.textContent="❌ Erreur";
st.className="status red";
message(e.message,true);
});
}
</script>
</body>
</html>
