<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestion Renault ZOE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: linear-gradient(
        135deg,
        #eef2ff,
        #f8fafc
      );

      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: white;

      border-radius: 28px;

      padding: 30px 24px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.12);
    }

    .car {
      text-align: center;
      font-size: 58px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      text-align: center;

      font-size: 29px;
      font-weight: 750;
    }

    .subtitle {
      text-align: center;

      color: #6b7280;

      margin-top: 8px;
      margin-bottom: 24px;
    }

    .status {
      padding: 14px;

      border-radius: 14px;

      text-align: center;

      font-size: 16px;
      font-weight: 700;

      margin-bottom: 24px;

      background: #dcfce7;
      color: #166534;
    }

    .status.borrowed {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.loading {
      background: #f3f4f6;
      color: #374151;
    }

    label {
      display: block;

      margin-top: 16px;

      font-weight: 650;
    }

    input {
      width: 100%;

      margin-top: 7px;

      padding: 15px;

      border: 1px solid #d1d5db;
      border-radius: 13px;

      font-size: 17px;

      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;

      border: none;
      border-radius: 14px;

      padding: 16px;

      margin-top: 22px;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;

      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .return-button {
      background: #e5e7eb;
      color: #111827;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 14px;

      border-radius: 13px;

      text-align: center;

      font-weight: 600;
    }

    .message.success {
      display: block;

      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;

      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      color: #6b7280;
    }
  </style>
</head>


<body>

  <main class="card">

    <div class="car">
      🚗
    </div>

    <h1 id="vehicleName">
      Renault ZOE
    </h1>

    <div class="subtitle">
      Gestion des emprunts
    </div>

    <div
      id="status"
      class="status loading"
    >
      Chargement...
    </div>

    <div id="content"></div>

    <div
      id="message"
      class="message"
    ></div>

  </main>


<script>

  /*
   * ================================
   * CONFIGURATION
   * ================================
   */

  const SUPABASE_URL =
    "https://jnuzpdljawgoznxmyehm.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_nQTVujJC9UE1iY2RREITgQ_G70n7nIv";


  /*
   * ================================
   * QR CODE
   * ================================
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const token =
    params.get("token");


  /*
   * ================================
   * ELEMENTS
   * ================================
   */

  const vehicleName =
    document.getElementById(
      "vehicleName"
    );


  const statusBox =
    document.getElementById(
      "status"
    );


  const content =
    document.getElementById(
      "content"
    );


  const message =
    document.getElementById(
      "message"
    );


  /*
   * ================================
   * SUPABASE REQUEST
   * ================================
   */

  async function supabaseRequest(
    path,
    options = {}
  ) {

    const response =
      await fetch(
        SUPABASE_URL + path,
        {
          ...options,

          headers: {
            "apikey": SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            ...(options.headers || {})
          }
        }
      );


    const text =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      data =
        text;

    }


    if (!response.ok) {

      throw new Error(
        data?.message ||
        data?.error ||
        "Une erreur est survenue."
      );

    }


    return data;

  }


  /*
   * ================================
   * AFFICHAGE MESSAGE
   * ================================
   */

  function showMessage(
    text,
    isError = false
  ) {

    message.textContent =
      text;

    message.className =
      "message " +
      (isError
        ? "error"
        : "success");

  }


  function clearMessage() {

    message.textContent = "";

    message.className =
      "message";

  }


  /*
   * ================================
   * CHARGER LE VEHICULE
   * ================================
   */

  async function loadVehicle() {

    clearMessage();


    if (!token) {

      statusBox.textContent =
        "QR code invalide";

      statusBox.className =
        "status borrowed";

      content.innerHTML = "";

      return;

    }


    try {

      const vehicles =
        await supabaseRequest(
          "/rest/v1/vehicles" +
          "?select=id,name,status,qr_token" +
          "&qr_token=eq." +
          encodeURIComponent(token)
        );


      if (
        !vehicles ||
        vehicles.length === 0
      ) {

        throw new Error(
          "Véhicule introuvable."
        );

      }


      const vehicle =
        vehicles[0];


      vehicleName.textContent =
        vehicle.name;


      /*
       * VEHICULE DISPONIBLE
       */

      if (
        vehicle.status ===
        "available"
      ) {

        statusBox.textContent =
          "🟢 Véhicule disponible";

        statusBox.className =
          "status";


        content.innerHTML = `

          <form id="borrowForm">

            <label>
              Prénom

              <input
                id="firstName"
                name="first_name"
                type="text"
                autocomplete="given-name"
                placeholder="Votre prénom"
                required
              >

            </label>


            <label>
              Nom

              <input
                id="lastName"
                name="last_name"
                type="text"
                autocomplete="family-name"
                placeholder="Votre nom"
                required
              >

            </label>


            <button
              id="borrowButton"
              type="submit"
            >
              Prendre le véhicule
            </button>

          </form>

        `;


        document
          .getElementById(
            "borrowForm"
          )
          .addEventListener(
            "submit",
            borrowVehicle
          );

      }


      /*
       * VEHICULE EMPRUNTE
       */

      else {

        statusBox.textContent =
          "🔴 Véhicule actuellement emprunté";

        statusBox.className =
          "status borrowed";


        content.innerHTML = `

          <button
            id="returnButton"
            class="return-button"
            type="button"
          >
            Retourner le véhicule
          </button>

        `;


        document
          .getElementById(
            "returnButton"
          )
          .addEventListener(
            "click",
            returnVehicle
          );

      }


    } catch (error) {

      statusBox.textContent =
        "Erreur";

      statusBox.className =
        "status borrowed";

      content.innerHTML = "";

      showMessage(
        error.message,
        true
      );

    }

  }


  /*
   * ================================
   * EMPRUNTER LE VEHICULE
   * ================================
   */

  async function borrowVehicle(
    event
  ) {

    event.preventDefault();


    const button =
      document.getElementById(
        "borrowButton"
      );


    const firstName =
      document
        .getElementById(
          "firstName"
        )
        .value
        .trim();


    const lastName =
      document
        .getElementById(
          "lastName"
        )
        .value
        .trim();


    if (
      !firstName ||
      !lastName
    ) {

      showMessage(
        "Merci de renseigner votre prénom et votre nom.",
        true
      );

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Enregistrement...";


    clearMessage();


    try {

      /*
       * Appel sécurisé Supabase.
       *
       * Cette fonction :
       * - enregistre l'emprunt
       * - change le statut
       * - envoie l'e-mail Brevo
       */

      const result =
        await supabaseRequest(
          "/functions/v1/vehicle-email-action",
          {
            method: "POST",

            body:
              JSON.stringify({
                action: "borrow",

                token: token,

                first_name:
                  firstName,

                last_name:
                  lastName
              })
          }
        );


      if (
        !result ||
        !result.ok
      ) {

        throw new Error(
          result?.error ||
          "Impossible d'enregistrer l'emprunt."
        );

      }


      showMessage(
        "✅ Véhicule pris avec succès. La notification a été traitée.",
        false
      );


      /*
       * Recharge la page
       * pour afficher le nouveau statut.
       */

      setTimeout(
        loadVehicle,
        1200
      );


    } catch (error) {

      showMessage(
        error.message,
        true
      );


      button.disabled =
        false;

      button.textContent =
        "Prendre le véhicule";

    }

  }


  /*
   * ================================
   * RETOURNER LE VEHICULE
   * ================================
   */

  async function returnVehicle() {

    const button =
      document.getElementById(
        "returnButton"
      );


    if (button) {

      button.disabled =
        true;

      button.textContent =
        "Enregistrement...";

    }


    clearMessage();


    try {

      /*
       * Appel sécurisé Supabase.
       *
       * Cette fonction :
       * - clôture l'emprunt
       * - enregistre la date de retour
       * - remet le véhicule disponible
       * - envoie l'e-mail Brevo
       */

      const result =
        await supabaseRequest(
          "/functions/v1/vehicle-email-action",
          {
            method: "POST",

            body:
              JSON.stringify({
                action: "return",

                token: token
              })
          }
        );


      if (
        !result ||
        !result.ok
      ) {

        throw new Error(
          result?.error ||
          "Impossible de retourner le véhicule."
        );

      }


      showMessage(
        "✅ Véhicule retourné avec succès. La notification a été traitée.",
        false
      );


      setTimeout(
        loadVehicle,
        1200
      );


    } catch (error) {

      showMessage(
        error.message,
        true
      );


      if (button) {

        button.disabled =
          false;

        button.textContent =
          "Retourner le véhicule";

      }

    }

  }


  /*
   * ================================
   * DEMARRAGE
   * ================================
   */

  loadVehicle();

</script>

</body>
</html>
